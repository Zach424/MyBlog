<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/icon.png" />
    <title>发布后台 · Zach424 Engineering Notes</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: #18263d;
        background: #f2f6f7;
        font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
      }
      body::before {
        display: block;
        height: 4px;
        background: linear-gradient(90deg, #b9431f 0 19%, #18263d 19% 78%, #486f78 78%);
        content: "";
      }
      .loading-shell {
        width: min(calc(100% - 2rem), 72rem);
        min-height: calc(100vh - 4px);
        display: grid;
        place-content: center;
        margin: auto;
      }
      .loading-shell div {
        max-width: 42rem;
        padding-left: 1.5rem;
        border-left: 1px solid #486f78;
      }
      .loading-shell p {
        margin: 0 0 0.75rem;
        color: #566d77;
        font: 0.72rem/1.5 "Cascadia Code", Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .loading-shell h1 {
        margin: 0;
        font-family: "Bahnschrift Condensed", "Arial Narrow", sans-serif;
        font-size: clamp(2.5rem, 7vw, 5rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .loading-shell span {
        display: block;
        margin-top: 1rem;
        color: #566d77;
        line-height: 1.8;
      }
      #studio-media-preflight {
        position: fixed;
        z-index: 2147483647;
        right: 1rem;
        bottom: 1rem;
        width: min(32rem, calc(100vw - 2rem));
        padding: 1rem 1.125rem;
        border: 1px solid #486f78;
        border-left: 3px solid #486f78;
        color: #18263d;
        background: #f2f6f7;
      }
      #studio-media-preflight[data-state="success"] { border-left-color: #2f756f; }
      #studio-media-preflight[data-state="error"] { border-left-color: #b9431f; }
      #studio-media-preflight [data-preflight-label] {
        margin: 0 0 0.35rem;
        color: #566d77;
        font: 0.68rem/1.4 "Cascadia Code", Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #studio-media-preflight strong,
      #studio-media-preflight [data-preflight-detail] { display: block; }
      #studio-media-preflight strong {
        margin-bottom: 0.25rem;
        font-size: 0.95rem;
      }
      #studio-media-preflight [data-preflight-detail] {
        color: #435c67;
        font-size: 0.82rem;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .stable-slug-control { width: 100%; }
      .stable-slug-control input[data-stable-slug-state="locked"] {
        border-color: #486f78;
        color: #435c67;
        background: #e7eff1;
        cursor: text;
      }
      .stable-slug-lifecycle {
        margin: 0;
        padding: 0.5rem 0 0 0.65rem;
        border-left: 2px solid #486f78;
        color: #566d77;
        font: 0.72rem/1.55 "Cascadia Code", Consolas, monospace;
      }
      .stable-slug-lifecycle strong {
        color: #486f78;
        font-weight: 700;
      }
      .stable-slug-lifecycle[data-state="editable"] {
        border-left-color: #b9431f;
      }
      .stable-slug-lifecycle[data-state="editable"] strong { color: #b9431f; }
      .studio-maintenance-link {
        position: fixed;
        z-index: 2147483646;
        left: 1rem;
        bottom: 1rem;
        display: grid;
        gap: 0.12rem;
        padding: 0.65rem 0.8rem 0.65rem 0.65rem;
        border: 1px solid #486f78;
        border-left: 3px solid #b9431f;
        color: #18263d;
        background: #f2f6f7;
        text-decoration: none;
      }
      .studio-maintenance-link span {
        color: #566d77;
        font: 0.58rem/1.2 "Cascadia Code", Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .studio-maintenance-link strong { font-size: 0.78rem; }
      .studio-maintenance-link:hover { border-left-color: #2f756f; }
      .studio-maintenance-link:focus-visible {
        outline: 3px solid #b9431f;
        outline-offset: 3px;
      }
      @media (max-width: 42rem) {
        .studio-maintenance-link { padding: 0.55rem 0.7rem 0.55rem 0.6rem; }
        .studio-maintenance-link span { display: none; }
      }
      @media (prefers-color-scheme: dark) {
        body { color: #edf4f5; background: #101820; }
        .loading-shell p, .loading-shell span { color: #a8b9be; }
        .loading-shell div { border-color: #5f8f99; }
        #studio-media-preflight {
          color: #edf4f5;
          background: #101820;
          border-color: #5f8f99;
        }
        #studio-media-preflight [data-preflight-label],
        #studio-media-preflight [data-preflight-detail] { color: #a8b9be; }
        .stable-slug-control input[data-stable-slug-state="locked"] {
          border-color: #5f8f99;
          color: #a8b9be;
          background: #16232c;
        }
        .stable-slug-lifecycle { color: #a8b9be; border-left-color: #5f8f99; }
        .stable-slug-lifecycle strong { color: #a8b9be; }
        .stable-slug-lifecycle[data-state="editable"] {
          color: #ff7851;
          border-left-color: #ff7851;
        }
        .stable-slug-lifecycle[data-state="editable"] strong { color: #ff7851; }
        .studio-maintenance-link {
          color: #edf4f5;
          background: #101820;
          border-color: #5f8f99;
          border-left-color: #ff7851;
        }
        .studio-maintenance-link span { color: #a8b9be; }
      }
    </style>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script
      defer
      crossorigin="anonymous"
      integrity="sha384-K+E/B3QG3FJrtRXoyUjME4ilx71pYGyrvAVxYvd/p0zCPuXsc3eoEuSzUW3Ke63V"
      src="/studio/editor-runtime-3.14.1.js"
    ></script>
    <script type="module">
      import { createStudioConfig } from "/studio/config.mjs";
      import { registerStudioGalleryEditor } from "/studio/gallery-editor.mjs";
      import { registerStudioMathPreview } from "/studio/math-preview.mjs";
      import { installStudioMediaPreflight } from "/studio/media-preflight.mjs";
      import { registerStableSlugWidget } from "/studio/stable-slug-widget.mjs";
      import { registerStudioVideoEditor } from "/studio/video-editor.mjs";

      installStudioMediaPreflight();

      window.addEventListener("load", () => {
        if (!window.CMS) {
          document.querySelector(".loading-shell span").textContent =
            "编辑器资源加载失败。请检查网络后刷新页面。";
          return;
        }
        try {
          registerStableSlugWidget();
          registerStudioGalleryEditor();
          registerStudioVideoEditor();
          registerStudioMathPreview();
        } catch (error) {
          document.querySelector(".loading-shell span").textContent =
            "Studio 作者控件加载失败。请刷新页面；若持续失败，请改用 Obsidian 或 Git。";
          console.error(error);
          return;
        }
        window.CMS.registerPreviewStyle("/studio/preview.css");
        window.CMS.init({ config: createStudioConfig(window.location.origin) });
      });
    </script>
  </head>
  <body>
    <a class="studio-maintenance-link" href="/studio/maintenance">
      <span>Content review</span>
      <strong>复核队列</strong>
    </a>
    <main class="loading-shell">
      <div>
        <p>Publishing studio / Git-backed</p>
        <h1>把草稿推进为<br />可验证的发布。</h1>
        <span>正在加载文章、项目和 GitHub 发布状态…</span>
      </div>
    </main>
  </body>
</html>
